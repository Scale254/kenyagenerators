<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#06b6d4" opacity="0.1"/>
  
  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  
  <!-- Logo area -->
  <g transform="translate(80, 80)">
    <!-- Logo icon placeholder -->
    <circle cx="40" cy="40" r="40" fill="url(#accent)"/>
    <path d="M25 40 Q40 20 55 40 Q40 60 25 40" fill="white"/>
  </g>
  
  <!-- Company name -->
  <text x="160" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">KGCS</text>
  
  <!-- Main heading -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">Power Generators &</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">Air Compressors Kenya</text>
  
  <!-- Tagline -->
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8">Dealers in Power Generators and Air Compressors</text>
  
  <!-- Bottom accent line -->
  <rect x="80" y="430" width="200" height="4" fill="url(#accent)" rx="2"/>
  
  <!-- Services list -->
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">✓ Diesel Generators</text>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">✓ Air Compressors</text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">✓ Spare Parts & Maintenance</text>
  
  <!-- Right side - generator silhouette -->
  <g transform="translate(750, 150)" opacity="0.3">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="white"/>
    <rect x="20" y="20" width="100" height="160" rx="5" fill="#3b82f6"/>
    <rect x="140" y="40" width="180" height="120" rx="5" fill="#1e40af"/>
    <circle cx="280" cy="160" r="25" fill="#3b82f6"/>
  </g>
  
  <!-- Website URL -->
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="20" fill="#64748b">kenyagenerators.co.ke</text>
</svg>